version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: globexa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: globexa_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: globexa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globexa-api
    environment:
      - APP_ENV=development
      - APP__ENVIRONMENT=development
      - APP_DEBUG=true
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=globexa_crm
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY__BROKER_URL=redis://redis:6379/0
      - CELERY__RESULT_BACKEND=redis://redis:6379/0
      - SECURITY_SECRET_KEY=${SECURITY_SECRET_KEY:-your-super-secret-key-change-in-production-min-32-chars}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globexa-worker
    environment:
      - APP_ENV=development
      - APP__ENVIRONMENT=development
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=globexa_crm
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY__BROKER_URL=redis://redis:6379/0
      - CELERY__RESULT_BACKEND=redis://redis:6379/0
      - SECURITY_SECRET_KEY=${SECURITY_SECRET_KEY:-your-super-secret-key-change-in-production-min-32-chars}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.workers.celery_app worker --loglevel=info --queues=emails,campaigns,ai,integrations,usage

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globexa-beat
    environment:
      - APP_ENV=development
      - APP__ENVIRONMENT=development
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=globexa_crm
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY__BROKER_URL=redis://redis:6379/0
      - CELERY__RESULT_BACKEND=redis://redis:6379/0
      - SECURITY_SECRET_KEY=${SECURITY_SECRET_KEY:-your-super-secret-key-change-in-production-min-32-chars}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.workers.celery_app beat --loglevel=info

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globexa-flower
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY__BROKER_URL=redis://redis:6379/0
      - CELERY__RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data: