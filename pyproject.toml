[project]
name = "globexa-crm"
version = "0.1.0"
description = "Globexa CRM - Multi-tenant AI-powered Sales CRM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pydantic-extra-types>=2.6.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "authlib>=1.3.0",
    "cryptography>=42.0.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "flower>=2.0.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "resend>=0.11.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "email-validator>=2.1.0",
    "phonenumbers>=8.13.0",
    "aiosmtplib>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=27.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=27.0.0",
    "pytest-mock>=3.13.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "ANN", "ARG", "PTH", "PD", "Q", "T20", "SIM", "TCH", "TRY", "DTZ", "ERA", "EXE", "ISC", "ICN", "LOG", "PERL", "PIE", "PL", "RSE", "RET", "SLF", "SLOT", "T10", "TID", "UN", "RUF"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ANN204", "ARG001", "ARG002", "B008", "C408", "PTH123", "S101", "S113", "T201", "T203"]
fixable = ["E", "F", "I", "W", "UP", "B", "C4", "ANN", "ARG", "PTH", "PD", "Q", "T20", "SIM", "TCH", "TRY", "DTZ", "ERA", "EXE", "ISC", "ICN", "LOG", "PERL", "PIE", "PL", "RSE", "RET", "SLF", "SLOT", "T10", "TID", "UN", "RUF"]
per-file-ignores = { "tests/*" = ["S101", "S113", "ARG001"] }

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*", "scripts*"]