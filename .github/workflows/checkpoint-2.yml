name: Checkpoint 2 - Security Hardening Verification

on:
  push:
    branches: [checkpoint-2-security-hardening]
  pull_request:
    branches: [checkpoint-2-security-hardening]

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_VERSION: "16"
  REDIS_VERSION: "7"

jobs:
  checkpoint-2-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: globexa_crm
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:${{ env.REDIS_VERSION }}
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-asyncio pytest-cov

      - name: Verify Python compilation
        run: |
          python -m compileall app alembic demo.py

      - name: Verify SQLAlchemy mapper configuration
        run: |
          python -c "
          from app.models import *
          from sqlalchemy.orm import configure_mappers
          configure_mappers()
          print('MAPPERS_OK')
          "

      - name: Run Alembic migrations on empty database
        run: |
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/globexa_crm
          export REDIS_URL=redis://localhost:6379/0
          export SECURITY_SECRET_KEY=test-secret-key-min-32-chars-long-for-testing
          export SECURITY_CREDENTIAL_ENCRYPTION_KEY=test-encryption-key-min-32-chars-long
          alembic upgrade head
          alembic current
          alembic heads

      - name: Verify RLS policies in PostgreSQL catalog
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d globexa_crm -c "
          -- Check RLS enabled on all tenant tables
          SELECT schemaname, tablename, rowsecurity, forcerowsecurity
          FROM pg_tables
          WHERE schemaname = 'public'
          AND rowsecurity = true
          ORDER BY tablename;
          
          -- Check policies exist
          SELECT schemaname, tablename, policyname, permissive, roles, cmd, qual, with_check
          FROM pg_policies
          WHERE schemaname = 'public'
          ORDER BY tablename, policyname;
          
          -- Count policies per table
          SELECT tablename, count(*) as policy_count
          FROM pg_policies
          WHERE schemaname = 'public'
          GROUP BY tablename
          ORDER BY tablename;
          "

      - name: Verify no duplicate RLS policies
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d globexa_crm -c "
          SELECT schemaname, tablename, policyname, count(*) as count
          FROM pg_policies
          WHERE schemaname = 'public'
          GROUP BY schemaname, tablename, policyname
          HAVING count(*) > 1;
          " | grep -v "count" | grep -v "^--" | grep -v "^$" | grep -v "^(0 rows)" && echo "DUPLICATE POLICIES FOUND!" && exit 1 || echo "No duplicate policies found"

      - name: Verify all tenant tables have RLS
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d globexa_crm -c "
          -- Get all tables with tenant_id column
          SELECT t.table_name
          FROM information_schema.columns c
          JOIN information_schema.tables t ON t.table_name = c.table_name
          WHERE c.column_name = 'tenant_id'
          AND t.table_schema = 'public'
          AND t.table_type = 'BASE TABLE'
          ORDER BY t.table_name;
          " -t > /tmp/tenant_tables.txt
          
          # Check each has RLS enabled
          while read table; do
            table=$(echo $table | xargs)
            if [ -n "$table" ]; then
              rls=$(psql -h localhost -U postgres -d globexa_crm -t -c "SELECT rowsecurity FROM pg_tables WHERE schemaname='public' AND tablename='$table';" | xargs)
              if [ "$rls" != "t" ]; then
                echo "TABLE $table MISSING RLS!"
                exit 1
              fi
            fi
          done < /tmp/tenant_tables.txt
          echo "All tenant tables have RLS enabled"

      - name: Verify FORCE RLS on critical tables
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d globexa_crm -c "
          SELECT tablename FROM pg_tables 
          WHERE schemaname = 'public' 
          AND forcerowsecurity = true
          ORDER BY tablename;
          " -t > /tmp/force_rls_tables.txt
          
          # Critical tables that must have FORCE RLS
          for table in memberships subscriptions feature_entitlements usage_records audit_logs ai_usage_logs contacts companies leads deals pipelines stages tasks notes activities proposals campaign_recipients integrations integration_credentials webhook_endpoints; do
            if ! grep -q "$table" /tmp/force_rls_tables.txt; then
              echo "CRITICAL TABLE $table MISSING FORCE RLS!"
              exit 1
            fi
          done
          echo "All critical tables have FORCE RLS enabled"

      - name: Verify Celery task registration
        run: |
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/globexa_crm
          export REDIS_URL=redis://localhost:6379/0
          export SECURITY_SECRET_KEY=test-secret-key-min-32-chars-long-for-testing
          export SECURITY_CREDENTIAL_ENCRYPTION_KEY=test-encryption-key-min-32-chars-long
          python -c "
          from app.workers.celery_app import celery_app
          import asyncio
          
          async def check_tasks():
              # Import all task modules to register tasks
              from app.workers.tasks import campaign_tasks_v2
              from app.workers.tasks import integration_tasks
              from app.workers.tasks import email_tasks
              from app.workers.tasks import ai_tasks
              
              registered = celery_app.tasks.keys()
              print(f'Total registered tasks: {len(registered)}')
              
              # Verify V2 campaign tasks
              required_tasks = [
                  'app.workers.tasks.campaign_tasks_v2.process_scheduled_campaigns',
                  'app.workers.tasks.campaign_tasks_v2.retry_failed_emails',
                  'app.workers.tasks.campaign_tasks_v2.send_campaign_task',
              ]
              
              for task in required_tasks:
                  if task not in registered:
                      print(f'MISSING REQUIRED TASK: {task}')
                      exit(1)
                  else:
                      print(f'FOUND: {task}')
              
              # Check queues
              queues = celery_app.conf.task_routes.keys() if celery_app.conf.task_routes else []
              print(f'Task routes configured: {len(queues)}')
              
              print('CELERY_TASKS_OK')
          
          asyncio.run(check_tasks())
          "

      - name: Run full pytest suite
        run: |
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/globexa_crm
          export REDIS_URL=redis://localhost:6379/0
          export SECURITY_SECRET_KEY=test-secret-key-min-32-chars-long-for-testing
          export SECURITY_CREDENTIAL_ENCRYPTION_KEY=test-encryption-key-min-32-chars-long
          export APP_ENVIRONMENT=testing
          pytest -q --tb=short

      - name: Run security-specific tests
        run: |
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/globexa_crm
          export REDIS_URL=redis://localhost:6379/0
          export SECURITY_SECRET_KEY=test-secret-key-min-32-chars-long-for-testing
          export SECURITY_CREDENTIAL_ENCRYPTION_KEY=test-encryption-key-min-32-chars-long
          export APP_ENVIRONMENT=testing
          pytest tests/test_security.py -q --tb=short

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc --format=json --output=pip-audit-report.json || true
          
          # Check for critical/high vulnerabilities
          python -c "
          import json
          with open('pip-audit-report.json') as f:
              data = json.load(f)
          
          critical = [v for v in data.get('vulnerabilities', []) if any('critical' in str(a).lower() for a in v.get('aliases', []))]
          high = [v for v in data.get('vulnerabilities', []) if any('high' in str(a).lower() for a in v.get('aliases', []))]
          
          print(f'Critical vulnerabilities: {len(critical)}')
          print(f'High vulnerabilities: {len(high)}')
          
          if critical:
              for v in critical:
                  print(f'  CRITICAL: {v}')
              exit(1)
          
          if high:
              print('High vulnerabilities found - review required:')
              for v in high[:10]:
                  print(f'  HIGH: {v}')
          "

      - name: Static security analysis (Bandit)
        run: |
          pip install bandit
          bandit -r app/ -f json -o bandit-report.json || true
          
          python -c "
          import json
          with open('bandit-report.json') as f:
              data = json.load(f)
          
          high_severity = [r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH']
          medium_severity = [r for r in data.get('results', []) if r.get('issue_severity') == 'MEDIUM']
          
          print(f'High severity findings: {len(high_severity)}')
          print(f'Medium severity findings: {len(medium_severity)}')
          
          for r in high_severity:
              print(f'  HIGH: {r[\"filename\"]}:{r[\"line_number\"]} - {r[\"issue_text\"]}')
          
          # Only fail on HIGH severity that are not false positives
          # Known false positives can be documented in .bandit config
          if high_severity:
              # Check if we have a .bandit config for known issues
              import os
              if os.path.exists('.bandit'):
                  print('Bandit config exists - review high findings against config')
              else:
                  print('WARNING: High severity findings found without .bandit config')
          "

      - name: Secret scanning (detect-secrets)
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files --exclude-files ".*\.pyc$" --exclude-files ".*/__pycache__/" > .secrets.baseline || true
          
          python -c "
          import json, os
          if os.path.exists('.secrets.baseline'):
              with open('.secrets.baseline') as f:
                  data = json.load(f)
              results = data.get('results', {})
              if results:
                  print(f'Potential secrets found in {len(results)} files:')
                  for file, secrets in results.items():
                      for secret in secrets:
                          print(f'  {file}:{secret[\"line_number\"]} - {secret[\"type\"]}')
                  # Don't fail - just warn for review
                  print('Review required for potential secrets')
              else:
                  print('No secrets detected')
          else:
              print('No baseline file generated')
          "

      - name: Ruff linting
        run: |
          pip install ruff
          ruff check app/ tests/ --output-format=github
          ruff format --check app/ tests/

      - name: Verify production Docker build
        run: |
          # Build production image
          docker build -t globexa-crm:test -f Dockerfile .
          
          # Verify non-root user
          docker run --rm globexa-crm:test whoami | grep -v root || (echo "Running as root!" && exit 1)
          
          # Verify no dev dependencies in production
          docker run --rm globexa-crm:test pip list | grep -E "(pytest|bandit|ruff|detect-secrets)" && echo "Dev dependencies found in production image" && exit 1 || echo "No dev dependencies in production image"
          
          # Verify healthcheck exists
          docker inspect globexa-crm:test | jq -r '.[0].Config.Healthcheck' | grep -v null || echo "No healthcheck configured"

      - name: Verify production Docker Compose
        run: |
          # Check production compose file exists and has correct settings
          test -f docker-compose.prod.yml || (echo "docker-compose.prod.yml missing!" && exit 1)
          
          # Verify PostgreSQL not exposed
          grep -q "ports:" docker-compose.prod.yml && echo "WARNING: Ports exposed in production compose" || echo "No ports exposed in production compose"
          
          # Verify internal networks
          grep -q "networks:" docker-compose.prod.yml || echo "WARNING: No networks defined in production compose"
          
          # Verify no demo passwords
          grep -q "postgres" docker-compose.prod.yml && echo "WARNING: Demo password found in production compose" || echo "No demo passwords in production compose"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-reports
          path: |
            pip-audit-report.json
            bandit-report.json
            .secrets.baseline

  summary:
    needs: checkpoint-2-security
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.checkpoint-2-security.result }}" != "success" ]; then
            echo "Gate 2: NOT COMPLETE ❌"
            echo "Check failed job logs above"
            exit 1
          else
            echo "Gate 2: COMPLETE ✅"
          fi