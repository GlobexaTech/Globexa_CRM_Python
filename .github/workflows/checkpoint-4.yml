name: Checkpoint 4 Gate
on:
  push:
    branches: [checkpoint-4-frontend-integration]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: globexa_cp2
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d globexa_cp2"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENVIRONMENT: testing
      APP_DEBUG: "false"
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: globexa_cp2
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      FRONTEND_REDIS_URL: redis://127.0.0.1:6379/13
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Preserve approved backend ancestry, tests and migrations
        run: |
          git merge-base --is-ancestor 0d030cf4d0f0f00cec05f443d91c41f44ee7ba43 HEAD
          git diff --exit-code 0d030cf4d0f0f00cec05f443d91c41f44ee7ba43 -- alembic/versions tests/conftest.py tests/test_auth.py tests/test_config.py tests/test_health.py tests/test_tenant_isolation.py tests/test_checkpoint2.py tests/test_checkpoint2_runtime.py tests/test_checkpoint3.py tests/test_checkpoint3_ai.py tests/test_checkpoint3_security.py
      - name: Install backend and initialize isolated secrets
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e '.[test]' ruff bandit pip-audit
          mkdir -p evidence/public
          python - <<'PY'
          import os, secrets
          from cryptography.fernet import Fernet
          generated = {
              'SECURITY_SECRET_KEY': secrets.token_hex(32),
              'SECURITY_CREDENTIAL_ENCRYPTION_KEY': Fernet.generate_key().decode(),
              'RUNTIME_DATABASE_PASSWORD': secrets.token_hex(24),
              'SESSION_ENCRYPTION_KEY': secrets.token_hex(32),
          }
          # Register every mask before later steps can display GITHUB_ENV values.
          for value in generated.values():
              escaped = value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::add-mask::' + escaped, flush=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name, value in generated.items():
                  output.write(name + '=' + value + '\n')
          PY
      - name: PostgreSQL 16 empty migrations, restricted role and Redis 7
        run: |
          python -m compileall -q app alembic scripts
          python -c 'from app import models; from sqlalchemy.orm import configure_mappers; configure_mappers()'
          alembic upgrade head
          alembic current > evidence/public/migrations.txt
          python scripts/provision_runtime.py
          python - <<'PY'
          import redis
          from app.workers.celery_app import celery_app
          celery_app.loader.import_default_modules()
          assert 'app.workers.tasks.crm_tasks.execute_operation' in celery_app.tasks
          connection = redis.Redis(host='127.0.0.1')
          assert connection.ping() and connection.info()['redis_version'].startswith('7.')
          PY
      - name: Complete original 116 backend tests and integration regressions
        run: pytest -q --junitxml=evidence/public/backend.xml | tee evidence/public/backend.txt
      - name: Backend correctness, security and dependency scans
        run: |
          ruff check --isolated --select E9,F63,F7,F82 app alembic scripts tests/test_checkpoint4.py | tee evidence/public/ruff.txt
          bandit -r app -f json -o evidence/public/bandit.json
          pip-audit -f json -o evidence/public/pip-audit.json
          python scripts/validate_openapi.py | tee evidence/public/openapi.txt
      - name: Frontend install, generated contracts and clean lint/typecheck/build
        working-directory: frontend
        run: |
          npm ci
          APP_ENVIRONMENT=testing python -c "import sys,json; sys.path.insert(0,'..'); from pathlib import Path; from app.main import app; Path('openapi.json').write_text(json.dumps(app.openapi(),indent=2))"
          npm run generate:api
          git diff --exit-code -- openapi.json src/api/generated.ts
          npm run lint | tee ../evidence/public/eslint.txt
          npm run typecheck | tee ../evidence/public/typecheck.txt
          npm run build | tee ../evidence/public/build.txt
          npm audit --audit-level=low --json > ../evidence/public/npm-audit.json
          npm run test:unit | tee ../evidence/public/frontend-unit.txt
          npx playwright install --with-deps chromium
      - name: Seed two real tenants and start actual API, Celery, Redis and frontend
        env:
          DATABASE_NAME: globexa_cp4_ci
          RUNTIME_DATABASE_ROLE: globexa_cp4_runtime
          CELERY_BROKER_URL: redis://127.0.0.1:6379/11
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/12
          APP_ORIGIN: http://127.0.0.1:3254
          BACKEND_API_URL: http://127.0.0.1:8004
        run: |
          python scripts/checkpoint4_fixture.py --bootstrap
          python scripts/checkpoint4_runtime.py api > evidence/api-private.log 2>&1 &
          python scripts/checkpoint4_runtime.py worker > evidence/worker-private.log 2>&1 &
          python scripts/checkpoint4_runtime.py scheduler > evidence/scheduler-private.log 2>&1 &
          python scripts/checkpoint4_runtime.py frontend > evidence/frontend-private.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for url in ['http://127.0.0.1:8004/health/live','http://127.0.0.1:3254/login']:
              for attempt in range(60):
                  try:
                      assert urllib.request.urlopen(url, timeout=2).status == 200
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise RuntimeError('Integration service did not become ready: ' + url)
          PY
      - name: Browser integration, role/tenant boundaries, accessibility and four viewports
        working-directory: frontend
        run: npm run test:e2e | tee ../evidence/public/frontend-e2e.txt
      - name: Production image and source secret scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker build -t globexa-checkpoint4 .
          test "$(docker inspect -f '{{.Config.User}}' globexa-checkpoint4)" = '10001:10001'
          docker run --rm -e APP_ENVIRONMENT=testing --entrypoint python globexa-checkpoint4 -c 'import importlib.util; from pathlib import Path; assert importlib.util.find_spec("pytest") is None; assert not Path("scripts/checkpoint4_runtime.py").exists(); from app.models import Base; print(len(Base.metadata.tables))'
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --dir /tmp/gitleaks
          tar -xzf /tmp/gitleaks/*linux_x64.tar.gz -C /tmp/gitleaks
          mkdir /tmp/cp4-source
          git archive HEAD | tar -x -C /tmp/cp4-source
          /tmp/gitleaks/gitleaks dir /tmp/cp4-source --redact --report-format json --report-path evidence/public/gitleaks.json
      - name: Prepare public evidence without credentials or private logs
        id: public_evidence
        if: always()
        run: python scripts/checkpoint4_public_evidence.py
      - name: CHECKPOINT 4 GATE PASS
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          from xml.etree import ElementTree
          sha = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          def count(file):
              suites = list(ElementTree.parse(file).getroot().iter('testsuite'))
              assert not any(int(s.attrib.get(k,0)) for s in suites for k in ['failures','errors','skipped'])
              return sum(int(s.attrib['tests']) for s in suites)
          backend = count('evidence/public/backend.xml')
          frontend = count('evidence/frontend-e2e.xml')
          assert backend >= 135 and frontend >= 57
          report = f'CHECKPOINT 4 GATE: PASS\n\nExact SHA: {sha}\nBackend tests: {backend}\nBrowser tests: {frontend}\nRun: https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}\n\nAll preceding mandatory checks succeeded; external paid providers alone use test adapters.\n'
          Path('evidence/public-artifact/CHECKPOINT_4_GATE.txt').write_text(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output: output.write(report)
          print(report)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.public_evidence.outcome == 'success'
        with:
          name: checkpoint-4-${{ github.sha }}
          path: evidence/public-artifact/
