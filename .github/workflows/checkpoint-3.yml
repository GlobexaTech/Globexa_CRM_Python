name: Checkpoint 3 Gate
on:
  push:
    branches: [checkpoint-3-crm-os-core]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: globexa_cp2
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d globexa_cp2"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENVIRONMENT: testing
      APP_DEBUG: "false"
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: globexa_cp2
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: Verify required baseline ancestry
        run: git merge-base --is-ancestor 350c0e8b939a2908ae1c0c2aff6218bd30a3163e HEAD
      - name: Preserve Checkpoint 2 security tests and historical migrations
        run: |
          git diff --exit-code 350c0e8b939a2908ae1c0c2aff6218bd30a3163e -- 'alembic/versions/00*' 'alembic/versions/010*' tests/test_auth.py tests/test_config.py tests/test_health.py tests/test_tenant_isolation.py tests/test_checkpoint2.py tests/test_checkpoint2_runtime.py
      - name: Install production and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e '.[test]' ruff bandit pip-audit
          mkdir -p evidence
          python - <<'PY'
          import os, secrets
          from cryptography.fernet import Fernet
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SECURITY_SECRET_KEY=' + secrets.token_hex(32) + '\n')
              output.write('SECURITY_CREDENTIAL_ENCRYPTION_KEY=' + Fernet.generate_key().decode() + '\n')
              output.write('RUNTIME_DATABASE_PASSWORD=' + secrets.token_hex(24) + '\n')
          PY
      - name: Compile and validate SQLAlchemy mappers
        run: |
          python -m compileall -q app alembic demo.py
          python -c 'from app import models; from sqlalchemy.orm import configure_mappers; configure_mappers(); print("MAPPERS_OK")'
      - name: Empty PostgreSQL 16 migration and runtime role
        run: |
          alembic upgrade head
          alembic current | tee evidence/migration.txt
          alembic heads
          python scripts/provision_runtime.py
      - name: Celery registration and real Redis 7 connection
        run: |
          python - <<'PY'
          from app.workers.celery_app import celery_app
          import redis
          celery_app.loader.import_default_modules()
          required = {'app.workers.tasks.campaign_tasks_v2.process_scheduled_campaigns', 'app.workers.tasks.campaign_tasks_v2.retry_failed_emails', 'app.workers.tasks.integration_tasks_v2.sync_integration_task', 'app.workers.tasks.foundation_tasks.deliver_event', 'app.workers.tasks.crm_tasks.crm_tick', 'app.workers.tasks.crm_tasks.execute_operation'}
          assert required <= celery_app.tasks.keys()
          client = redis.Redis(host='127.0.0.1')
          assert client.ping()
          assert client.info()['redis_version'].startswith('7.')
          print('CELERY_AND_REDIS_OK')
          PY
      - name: Validate and export OpenAPI frontend contract
        run: python scripts/validate_openapi.py | tee evidence/openapi-validation.txt
      - name: Complete tests including restricted-role RLS security tests
        run: pytest -q --junitxml=evidence/pytest.xml | tee evidence/pytest.txt
      - name: Ruff correctness scan
        run: ruff check --isolated --select E9,F63,F7,F82 app alembic demo.py | tee evidence/ruff.txt
      - name: Bandit security scan
        run: bandit -r app -f json -o evidence/bandit.json
      - name: Dependency vulnerability scan
        run: pip-audit -f json -o evidence/pip-audit.json
      - name: Secret scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --dir /tmp/gitleaks
          tar -xzf /tmp/gitleaks/*linux_x64.tar.gz -C /tmp/gitleaks
          mkdir /tmp/cp3-source
          git archive HEAD | tar -x -C /tmp/cp3-source
          /tmp/gitleaks/gitleaks dir /tmp/cp3-source --redact --report-format json --report-path evidence/gitleaks.json
      - name: Build and inspect production container
        run: |
          docker build -t globexa-checkpoint3 .
          test "$(docker inspect -f '{{.Config.User}}' globexa-checkpoint3)" = '10001:10001'
          docker run --rm -e APP_ENVIRONMENT=testing --entrypoint python globexa-checkpoint3 -c 'import importlib.util; assert importlib.util.find_spec("pytest") is None; assert importlib.util.find_spec("ruff") is None; from app.models import Base; print(len(Base.metadata.tables))'
      - name: Record exact commit evidence
        if: always()
        run: |
          git rev-parse HEAD > evidence/commit.txt
          echo "${{ github.run_id }}" > evidence/run-id.txt
          pip freeze > evidence/dependencies.txt
      - name: Generate verified Gate 3 report
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          suites = ElementTree.parse('evidence/pytest.xml').getroot().iter('testsuite')
          count = sum(int(suite.attrib['tests']) for suite in suites)
          sha = Path('evidence/commit.txt').read_text().strip()
          run = os.environ['GITHUB_RUN_ID']
          report = f'''# Gate 3 executed evidence

          Gate 3: COMPLETE ✅

          Commit: `{sha}`
          Run: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run}
          Passed tests: {count}
          Migration head: 012_activity_relation

          - [x] Compile and SQLAlchemy mappers
          - [x] Empty PostgreSQL 16 migrations and restricted runtime role
          - [x] FORCE RLS inventory: 57 tenant tables plus users and tenants
          - [x] Celery registration and Redis 7
          - [x] Complete original and security regression suite
          - [x] CRM frontend workflows, OpenAPI, event subscribers, AI and automation contracts
          - [x] Ruff correctness, Bandit, pip-audit and Gitleaks
          - [x] Production image build, non-root identity, no development dependencies

          This report is generated only after every required execution step succeeds.
          The final workflow conclusion and evidence upload must also be successful.
          See CHECKPOINT_3_REPORT.md for architecture and limitations.
          '''
          report = '\n'.join(line.removeprefix('          ') for line in report.splitlines()) + '\n'
          Path('evidence/DEMO_GATE_3_CHECKLIST.md').write_text(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(report)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-3-${{ github.sha }}
          path: evidence/
